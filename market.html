"use strict";
/* Roman Urdu text on the Analysis page only. RM(english, romanUrdu) gives the Roman Urdu version there and English everywhere else. */

const SHOWN = TFS.filter(t => t.show);
const WINDOWS = [50, 100]; // "last N candles" analysis windows
const HOSTS = ["https://api.binance.com", "https://data-api.binance.vision", "https://api1.binance.com", "https://api2.binance.com", "https://api3.binance.com"];

const SESSIONS = [
  { id: "asia", name: "Asia (Tokyo)", tz: "Asia/Tokyo", from: 9, to: 18, color: "--ema50" },
  { id: "london", name: "London (UK)", tz: "Europe/London", from: 8, to: 17, color: "--ema20" },
  { id: "ny", name: "New York (US)", tz: "America/New_York", from: 8, to: 17, color: "--ema200" }

const state = {
  symbol: "BTCUSDT", chartTf: "15m", A: {}, demo: false, sig: null,

/* Money flow and coin strength. "Money in" means aggressive buyers (market buys) paid more than aggressive sellers, taken from Binance

function fmtUsd(v) { const a = Math.abs(v), s = v < 0 ? "-" : "+"; return s + "$" + (a >= 1e9 ? (a / 1e9).toFixed(2) + "B" : a >= 1e6 ? (a / 1e6).toFixed(2) + "M" : a >= 1e3 ? (a / 1e3).toFixed(0) + "K" : a.toFixed(0)); }

  if (!c || c.length < 60 || c[c.length - 1].tq == null || !(c[c.length - 1].q > 0)) return null;
  const n = c.length, sumH = h => { let net = 0, q = 0, tq = 0; for (let i = Math.max(0, n - h); i < n; i++) { q += c[i].q; tq += c[i].tq; } net = 2 * tq - q; return { net, share: q ? tq / q : 0.5, q }; };

  const chg = h => n > h ? last / closes[n - 1 - h] - 1 : 0, chg24 = chg(24), chg7 = chg(Math.min(167, n - 1));

  add(f4.share > 0.52 ? 1 : f4.share < 0.48 ? -1 : 0, "last 4h " + (f4.share * 100).toFixed(1) + "% buy");

    '<div class="grid"><div><h3 class="h3">Biggest buy walls (support)</h3>' + wallTable(B.wallsB) + '</div><div><h3 class="h3">Biggest sell walls (resistance)</h3>' + wallTable(B.wallsA) + '</div></div>';
  const cv = $("mkCv"), dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 700, h = 190; cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr); cv.style.height = h + "px";
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const lo = B.mid * 0.97, hi = B.mid * 1.03, bs = B.bids.filter(x => x[0] >= lo), as = B.asks.filter(x => x[0] <= hi); let cum = 0;
  const bc = bs.map(x => ({ p: x[0], c: (cum += x[0] * x[1]) })); cum = 0; const ac = as.map(x => ({ p: x[0], c: (cum += x[0] * x[1]) }));
  const mx = Math.max(bc.length ? bc[bc.length - 1].c : 1, ac.length ? ac[ac.length - 1].c : 1), X = p => (p - lo) / (hi - lo) * w, Y = c => h - 18 - c / mx * (h - 30);
  [[bc, css("--up")], [ac, css("--down")]].forEach(([arr, col]) => { if (!arr.length) return; ctx.fillStyle = col; ctx.strokeStyle = col; ctx.globalAlpha = 0.22; ctx.beginPath(); ctx.moveTo(X(arr[0].p), h - 18); arr.forEach(q => ctx.lineTo(X(q.p), Y(q.c))); ctx.lineTo(X(arr[arr.length - 1].p), h - 18); ctx.fill(); ctx.globalAlpha = 1; ctx.lineWidth = 1.8; ctx.beginPath(); arr.forEach((q, i) => { if (i) ctx.lineTo(X(q.p), Y(q.c)); else ctx.moveTo(X(q.p), Y(q.c)); }); ctx.stroke(); });
  ctx.strokeStyle = css("--muted"); ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X(B.mid), 0); ctx.lineTo(X(B.mid), h - 18); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = css("--muted"); ctx.font = "11px " + css("--font-mono"); ctx.textAlign = "left"; ctx.fillText(fp(lo) + "  (-3%)", 4, h - 4); ctx.textAlign = "right"; ctx.fillText("(+3%)  " + fp(hi), w - 4, h - 4); ctx.textAlign = "center"; ctx.fillText("price " + fp(B.mid), X(B.mid), 12);
}
function wallTable(ws) { return ws.length ? '<div class="tbl"><table><thead><tr><th>Price area</th><th>Size</th><th>vs normal</th><th>From price</th></tr></thead><tbody>' + ws.map(x => '<tr><td class="num">' + fp(x.lo) + (x.hi > x.lo ? ' - ' + fp(x.hi) : '') + '</td><td class="num">' + fmtUsd(x.usd).replace("+", "") + '</td><td class="num">' + x.x.toFixed(1) + 'x</td><td class="num">' + (x.dist >= 0 ? "+" : "") + x.dist.toFixed(2) + '%</td></tr>').join("") + '</tbody></table></div>' : '<div class="sub">No unusually big wall right now.</div>'; }

/* ---------- Direction + leverage formula ---------- */
const FM = { risk: +store.get("fmRisk", "0.10"), sig: {} };
async function fmSigma(pair) {
  const c = FM.sig[pair]; if (c && Date.now() - c.at < 300000) return c;
  const k = await jget("/api/v3/klines?symbol=" + pair + "&interval=1h&limit=500");
  const r = []; for (let i = 1; i < k.length - 1; i++) r.push(Math.log(+k[i][4] / +k[i - 1][4]));
  const n = r.length, mean = r.reduce((a, b) => a + b, 0) / n, lv = r.reduce((a, b) => a + (b - mean) * (b - mean), 0) / n;
  const al = 0.08, be = 0.9, om = lv * (1 - al - be); let v = lv;
  for (let i = 0; i < n; i++) v = om + al * (r[i] - mean) * (r[i] - mean) + be * v;
  const o = { at: Date.now(), hr: Math.sqrt(v), day: Math.sqrt(v * 24), longRun: Math.sqrt(lv * 24) };
  return (FM.sig[pair] = o);
}
async function renderFormula() {
  const B = MK.book, box = $("fmBox"); if (!B || !box) return;
  let sg = null; try { sg = await fmSigma(B.pair); } catch (e) {}
  const N = 10, vb = B.bids.slice(0, N).reduce((a, x) => a + x[0] * x[1], 0), va = B.asks.slice(0, N).reduce((a, x) => a + x[0] * x[1], 0);
  const I = vb + va ? (vb - va) / (vb + va) : 0, spread = B.asks[0][0] - B.bids[0][0], phi = spread / B.mid;
  const dir = I > 0.1 ? "LONG side" : I < -0.1 ? "SHORT side" : "NEUTRAL", cls = I > 0.1 ? "up" : I < -0.1 ? "down" : "mute";
  const lev = sg ? Math.max(1, Math.min(20, Math.floor(FM.risk / sg.day))) : null;
  const row = (a, b) => '<div class="kv"><span>' + a + '</span><span class="mono">' + b + '</span></div>';
  box.innerHTML = '<div class="sub"><b>' + esc(coinOf(B.pair)) + '</b> price ' + fp(B.mid) + ', updated ' + ago(B.at) + '</div>' +
    row("Top " + N + " levels: bid volume (V bid)", fmtUsd(vb).replace("+", "")) + row("Top " + N + " levels: ask volume (V ask)", fmtUsd(va).replace("+", "")) +
    row("Imbalance I", '<span class="' + (I > 0.1 ? "up-t" : I < -0.1 ? "down-t" : "") + '">' + (I >= 0 ? "+" : "") + I.toFixed(3) + '</span> <span class="pill ' + cls + '">' + dir + '</span>') +
    row("Spread S = Ask - Bid", fp(spread)) + row("Relative spread (cost)", (phi * 100).toFixed(4) + "%" + (phi > 0.0005 ? " (wide, costly)" : "")) +
    (sg ? row("Forecast volatility, next 1h", (sg.hr * 100).toFixed(2) + "%") + row("Forecast volatility, 1 day", (sg.day * 100).toFixed(2) + "% (long-run average " + (sg.longRun * 100).toFixed(2) + "%)") +
      row("Max leverage", '<b>' + lev + 'x</b>' + (sg.day > sg.longRun * 1.3 ? " (volatility above normal, so lower)" : sg.day < sg.longRun * 0.75 ? " (volatility below normal, so higher is allowed)" : "")) :
      '<div class="sub">Could not load price history for the volatility forecast.</div>');
}
function fmInit() {
  const el = $("fmRisk"); if (!el) return;
  el.innerHTML = [0.05, 0.10, 0.15, 0.20].map(v => '<option value="' + v + '"' + (v === FM.risk ? " selected" : "") + '>' + Math.round(v * 100) + '%</option>').join("");
  el.addEventListener("change", e => { FM.risk = +e.target.value; store.set("fmRisk", String(FM.risk)); renderFormula(); });
}
/* ---------- Long / short ---------- */
async function fget(path) { const r = await fetch(FAPI + path); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function loadLS() {
  try {
    const prem = await fget("/fapi/v1/premiumIndex"), fm = {}; prem.forEach(p => { fm[p.symbol] = +p.lastFundingRate; });
    const coins = MK.syms.filter(s => fm[s] != null).slice(0, 30), rows = []; let i = 0;
    const run = async () => { while (i < coins.length) { const s = coins[i++]; try {
      const [g, t] = await Promise.all([fget("/futures/data/globalLongShortAccountRatio?symbol=" + s + "&period=1h&limit=1"), fget("/futures/data/topLongShortPositionRatio?symbol=" + s + "&period=1h&limit=1")]);
      if (g[0]) rows.push({ sym: coinOf(s), pair: s, fund: fm[s], gl: +g[0].longAccount, gs: +g[0].shortAccount, tl: t[0] ? +t[0].longAccount : null, ts: t[0] ? +t[0].shortAccount : null }); } catch (e) { /* skip */ } } };
    await Promise.all(Array.from({ length: 5 }, run));
    MK.ls = rows; MK.lsAt = Date.now(); renderLS();
  } catch (e) { $("mkLs").innerHTML = '<div class="sub">Could not load futures data (' + esc(e && e.message ? e.message : "network error") + '). Binance futures may be blocked on your network or in your country.</div>'; }
}
function renderLS() {
  $("mkLsAt").textContent = "updated " + ago(MK.lsAt);
  const read = r => { const crowdL = r.gl >= 0.6, crowdS = r.gs >= 0.6; if (crowdL && r.fund > 0.0002) return ["LONGS CROWDED", "down", "Many longs and expensive funding: a drop can force them out."]; if (crowdS && r.fund < -0.0002) return ["SHORTS CROWDED", "up", "Many shorts and negative funding: a rise can force them out."];
    if (crowdL) return ["MORE LONGS", "warn", "Most accounts are long."]; if (crowdS) return ["MORE SHORTS", "warn", "Most accounts are short."]; return ["BALANCED", "mute", ""]; };
  const rows = MK.ls.slice().sort((a, b) => Math.abs(b.gl - 0.5) - Math.abs(a.gl - 0.5));
  $("mkLs").innerHTML = rows.length ? '<div class="tbl"><table><thead><tr><th>Token</th><th>Crowd long</th><th>Crowd short</th><th>Top traders long</th><th>Top traders short</th><th>Funding (8h)</th><th>Reading</th></tr></thead><tbody>' +
    rows.map(r => { const rd = read(r); return '<tr><td><b>' + esc(r.sym) + '</b></td><td class="num up-t">' + (r.gl * 100).toFixed(1) + '%</td><td class="num down-t">' + (r.gs * 100).toFixed(1) + '%</td><td class="num up-t">' + (r.tl == null ? "n/a" : (r.tl * 100).toFixed(1) + "%") + '</td><td class="num down-t">' + (r.ts == null ? "n/a" : (r.ts * 100).toFixed(1) + "%") + '</td><td class="num ' + (r.fund >= 0 ? "up-t" : "down-t") + '">' + (r.fund * 100).toFixed(4) + '%</td><td><span class="pill ' + rd[1] + '">' + rd[0] + '</span> <span class="mute-t">' + esc(rd[2]) + '</span></td></tr>'; }).join("") + '</tbody></table></div>' : '<div class="sub">No data yet.</div>';
}
function mkInit() {
  $("mkThr").innerHTML = [25000, 50000, 100000, 250000, 500000, 1000000].map(v => '<option value="' + v + '"' + (v === MK.thr ? " selected" : "") + '>' + fmtUsd(v).replace("+", "") + '</option>').join("");
  $("mkThr").addEventListener("change", async e => { MK.thr = +e.target.value; store.set("mkThr", String(MK.thr)); MK.tot = {}; MK.feed = []; MK.dirty = true; await mkBackfill(); });
  $("mkCoin").value = MK.coin; $("mkList").innerHTML = state.uni.list.slice(0, 400).map(c => '<option value="' + c.pair + '"></option>').join("");
  const go = () => { MK.coin = normalizePair($("mkCoin").value); $("mkCoin").value = MK.coin; store.set("mkCoin", MK.coin); loadBook(); };
  $("mkGo").addEventListener("click", go); $("mkCoin").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
  window.addEventListener("resize", () => renderBook());
}
async function mkStart() {
  await loadUniverse(); MK.syms = state.uni.list.map(c => c.pair); $("capNote").textContent = state.capMsg || "";
  mkInit(); fmInit(); mkConnect(); mkConnectLiq(); mkBackfill(); loadBook(); loadLS();
  setInterval(mkRender, 1000); setInterval(() => { if (!document.hidden) loadBook(); }, 5000); setInterval(() => { if (!document.hidden) loadLS(); }, 120000);
}
boot({ file: "market.html", title: "Big money", data: false, symbolBox: false, skeleton: MK_SKEL, render: () => {}, after: mkStart });
