<script>
"use strict";
/* Indicators and the per-timeframe analysis object. */
function EMA(v, n) {
  const out = new Array(v.length).fill(null);
  if (v.length < n) return out;
  let s = 0; for (let i = 0; i < n; i++) s += v[i];
  let e = s / n; out[n - 1] = e;
  const k = 2 / (n + 1);
  for (let i = n; i < v.length; i++) { e = v[i] * k + e * (1 - k); out[i] = e; }
  return out;
}
function SMA(v, n) {
  const out = new Array(v.length).fill(null);
  let s = 0;
  for (let i = 0; i < v.length; i++) {
    s += v[i];
    if (i >= n) s -= v[i - n];
    if (i >= n - 1) out[i] = s / n;
  }
  return out;
}
function RSI(v, n) {
  n = n || 14;
  const out = new Array(v.length).fill(null);
  if (v.length <= n) return out;
  let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = v[i] - v[i - 1]; g += Math.max(d, 0); l += Math.max(-d, 0); }
  g /= n; l /= n;
  out[n] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  for (let i = n + 1; i < v.length; i++) {
    const d = v[i] - v[i - 1];
    g = (g * (n - 1) + Math.max(d, 0)) / n;
    l = (l * (n - 1) + Math.max(-d, 0)) / n;
    out[i] = l === 0 ? 100 : 100 - 100 / (1 + g / l);
  }
  return out;
}
function ATR(c, n) {
  n = n || 14;
  const out = new Array(c.length).fill(null);
  if (c.length <= n) return out;
  const tr = c.map((x, i) => i === 0 ? x.h - x.l : Math.max(x.h - x.l, Math.abs(x.h - c[i - 1].c), Math.abs(x.l - c[i - 1].c)));
  let a = 0; for (let i = 1; i <= n; i++) a += tr[i];
  a /= n; out[n] = a;
  for (let i = n + 1; i < c.length; i++) { a = (a * (n - 1) + tr[i]) / n; out[i] = a; }
  return out;
}
/* tf is one entry of TFS. The last candle is still forming, so "closed" always means index length-2. */
function analyze(candles, tf) {
  const closes = candles.map(c => c.c);
  const a = {
    tf, candles, closes,
    ema20: EMA(closes, 20), ema50: EMA(closes, 50), ema200: EMA(closes, 200),
    rsi: RSI(closes, 14), atr: ATR(candles, 14), volSma: SMA(candles.map(c => c.v), 20)
  };
  a.swings = findSwings(a, tf.k);
  a.struct = structureOf(a);
  return a;
}
/* Simple EMA based trend. Used for the daily chart, which is kept as hidden background bias. */
function trendOf(a) {
  const i = a.candles.length - 2;
  const c = a.closes[i], e20 = a.ema20[i], e50 = a.ema50[i], e200 = a.ema200[i];
  let s = 0, max = 0;
  if (e50 != null) { max++; s += c > e50 ? 1 : -1; }
  if (e20 != null && e50 != null) { max++; s += e20 > e50 ? 1 : -1; }
  if (e50 != null && e200 != null) { max++; s += e50 > e200 ? 1 : -1; }
  if (e50 != null && i >= 5 && a.ema50[i - 5] != null) { max++; s += e50 > a.ema50[i - 5] ? 1 : -1; }
  const dir = s >= 2 ? "up" : s <= -2 ? "down" : "side";
  return { s, max, dir };
}

const fmtCache = {};

}

  return { act, change: t };
}
/* Uses 1 hour candles (about 12 days). Sessions are measured from the first to the last candle inside the session window. */
function sessionStats(c) {

  return SESSIONS.map(s => {
    const m = new Map();
    c.forEach((k, idx) => {
      if (!sessionActive(s, k.t)) return;
      const key = localHM(k.t, s.tz).day; let g = m.get(key);
      if (!g) { g = { o: k.o, c: k.c, h: k.h, l: k.l, v: 0, n: 0, t: k.t, last: idx }; m.set(key, g); }
      g.c = k.c; g.h = Math.max(g.h, k.h); g.l = Math.min(g.l, k.l); g.v += k.v; g.n++; g.last = idx;
    });
    const arr = [...m.values()].sort((a, b) => a.t - b.t);
    const cur = arr[arr.length - 1] || null;
    const live = cur && cur.last === c.length - 1 ? cur : null;
    const full = arr.filter(g => g !== live && g.n >= 8).slice(-7);

    '<div class="controls"><a id="exGo" class="primary" style="padding:8px 14px;border-radius:6px;text-decoration:none" target="_blank" rel="noopener noreferrer">Open ' + esc(coinOf(state.symbol)) + ' on exchange</a><button id="exCopy">Copy order details</button><span id="exMsg" class="note" style="margin:0"></span></div>' +
    '<div class="note">This opens the coin on the exchange website or app. You place the order yourself, using the entry, stop loss and targets shown above. The app never asks for API keys and never trades for you. Pasting trading keys into a web page is risky, so it is left out on purpose. The signal pair is the Binance USDT pair, so check the price on your exchange before you enter.</div>';
  const upd = () => { store.set("ex", $("exSel").value); store.set("exMarket", $("exMk").value); $("exGo").href = exchangeUrl($("exSel").value, state.symbol, $("exMk").value); };
  $("exSel").addEventListener("change", upd); $("exMk").addEventListener("change", upd); upd();
  $("exCopy").addEventListener("click", async () => {
    const txt = orderText(s, state.symbol);
    try { await navigator.clipboard.writeText(txt); $("exMsg").textContent = "Copied."; } catch (e) { $("exMsg").textContent = txt.replace(/\n/g, " | "); }
  });
}

</script>
<script>
"use strict";
const LOG_SKELETON = '<section class="card"><div class="status-row"><h2 style="margin:0">Paper trade log</h2><div class="controls"><button id="lgRe">Check open trades</button><button id="lgCsv">Copy CSV</button><button id="lgClr">Clear log</button></div></div><div id="lgSum"></div><canvas id="lgCv" height="160"></canvas></section>' +
  '<section class="card"><div id="lgTbl"></div><div class="note">Every LONG / SHORT SETUP shown on the Signals page while it is open is logged here automatically, with its entry, stop and targets. Nothing is sent to any exchange. A trade ends at the stop (-1R), at Target 2, or after 24 hours at the market price, with a 0.1% fee taken off. If both the stop and the target sit inside one 5m candle, the stop counts first. Keep the Signals page open (or open it often) so setups get recorded. After 50 or more closed trades, the win rate and average R tell you whether the signals really work.</div></section>';
function renderLog() {
  const L = logGet(), S = logStats(L);
  $("lgSum").innerHTML = '<div class="kv"><span>Closed trades</span><span class="mono">' + S.n + ' (' + S.open + ' open)</span></div>' +
    '<div class="kv"><span>Win rate</span><span class="mono">' + (S.win == null ? "n/a" : (S.win * 100).toFixed(1) + "% (" + S.wins + " wins)") + '</span></div>' +
    '<div class="kv"><span>Average result per trade</span><span class="mono ' + (S.avg == null ? "" : S.avg >= 0 ? "up-t" : "down-t") + '">' + (S.avg == null ? "n/a" : (S.avg >= 0 ? "+" : "") + S.avg.toFixed(2) + "R") + '</span></div>' +
    '<div class="kv"><span>Total</span><span class="mono ' + (S.tot >= 0 ? "up-t" : "down-t") + '">' + (S.tot >= 0 ? "+" : "") + S.tot.toFixed(2) + 'R</span></div><div class="kv"><span>Worst drop from a peak</span><span class="mono">' + S.dd.toFixed(2) + 'R</span></div>' +
    (S.n < 30 ? '<div class="sub">Under 30 closed trades is too few to judge anything.</div>' : '');
  const cv = $("lgCv"), P = setupCanvas(cv, 160), ctx = P.ctx; ctx.clearRect(0, 0, P.w, P.h);
  if (S.curve.length > 1) {
    const mn = Math.min(0, ...S.curve), mx = Math.max(0.5, ...S.curve), y = v => 10 + (mx - v) / (mx - mn) * (P.h - 24), x = i => 10 + i / (S.curve.length - 1) * (P.w - 20);
    ctx.strokeStyle = css("--line"); ctx.beginPath(); ctx.moveTo(0, y(0)); ctx.lineTo(P.w, y(0)); ctx.stroke();
    ctx.strokeStyle = S.tot >= 0 ? css("--up") : css("--down"); ctx.lineWidth = 2; ctx.beginPath(); S.curve.forEach((v, i) => { if (i) ctx.lineTo(x(i), y(v)); else ctx.moveTo(x(i), y(v)); }); ctx.stroke();
    ctx.fillStyle = css("--muted"); ctx.font = "11px " + css("--font-mono"); ctx.fillText("cumulative R", 10, 12);
  }
  $("lgTbl").innerHTML = L.length ? '<div class="tbl"><table><thead><tr><th>Time</th><th>Coin</th><th>Side</th><th>Entry</th><th>Stop</th><th>Target 2</th><th>Score</th><th>Result</th><th>R</th></tr></thead><tbody>' +
    L.slice().reverse().map(x => '<tr><td>' + esc(dayTime(x.t)) + '</td><td><b>' + esc(coinOf(x.pair)) + '</b></td><td><span class="pill ' + (x.side === "LONG" ? "up" : "down") + '">' + x.side + '</span></td><td class="num">' + fp(x.entry) + '</td><td class="num">' + fp(x.sl) + '</td><td class="num">' + fp(x.tp2) + '</td><td class="num">' + x.score + '/' + x.max + '</td><td>' + (x.status === "open" ? '<span class="pill warn">OPEN</span>' : esc(x.res)) + '</td><td class="num ' + (x.r == null ? "" : x.r >= 0 ? "up-t" : "down-t") + '">' + (x.r == null ? "" : (x.r >= 0 ? "+" : "") + x.r.toFixed(2)) + '</td></tr>').join("") + '</tbody></table></div>' : '<div class="sub">No trades yet. Open the Signals page and keep it open: the first LONG or SHORT SETUP will be logged here.</div>';
}
function setupCanvas(cv, h) { const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 800; cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr); cv.style.height = h + "px"; const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return { ctx, w, h }; }
async function checkLog() { $("lgRe").disabled = true; await resolveTrades(); $("lgRe").disabled = false; renderLog(); }
boot({ file: "log.html", title: "Trade log", data: false, symbolBox: false, skeleton: LOG_SKELETON, render: renderLog,
  init: () => {
    $("lgRe").addEventListener("click", checkLog);
    $("lgClr").addEventListener("click", () => { if (confirm("Delete the whole paper trade log?")) { logSet([]); renderLog(); } });
    $("lgCsv").addEventListener("click", () => { const csv = "time,coin,side,entry,stop,target2,score,result,R\n" + logGet().map(x => [new Date(x.t).toISOString(), x.pair, x.side, x.entry, x.sl, x.tp2, x.score, x.res || "open", x.r == null ? "" : x.r.toFixed(3)].join(",")).join("\n"); try { navigator.clipboard.writeText(csv); } catch (e) { /* ignore */ } });
  }, after: checkLog });
window.addEventListener("resize", () => { if ($("lgCv")) renderLog(); });

</script>
</body>
